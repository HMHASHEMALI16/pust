<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Professors — PUST Evaluation</title><link rel="stylesheet" href="css/style.css"><link rel="icon" href="assets/logo.svg"></head><body>
<main class="wrap" style="padding:28px 16px">
<h1>Professors</h1><p class="sub">Ranked by feedback: most-reviewed first, then by overall score.</p>
<div class="toolbar"><input id="f" placeholder="Search professors..."><select id="dept"><option value="">All departments</option></select></div>
<div class="grid" id="g"></div>
</main>
<script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/db.js"></script><script src="js/ui.js"></script>
<script>
PUST_UI.mount();
(async()=>{
  const {departments,professors}=await PUST_DB.loadPublic();
  await PUST_DB.refresh().catch(()=>{});
  document.getElementById("dept").innerHTML=`<option value="">All departments</option>`+departments.map(d=>`<option>${d.code}</option>`).join("");
  function render(){
    const s=document.getElementById("f").value.toLowerCase(),df=document.getElementById("dept").value;
    const rows=professors.filter(p=>(!df||p.department_code===df)&&p.name.toLowerCase().includes(s))
      .map(p=>({...p,...PUST_DB.profStats(p.pust_id||p.id)}))
      .sort((a,b)=>b.count-a.count||b.overall-a.overall).slice(0,300);
    document.getElementById("g").innerHTML=rows.map(p=>`<a class="prow" href="professor.html?id=${p.pust_id||p.id}">
      ${PUST_UI.avatar(p.name,p.photo_url)}<span class="pmeta"><b>${PUST_UI.esc(p.name)}</b><span>${p.department_code} • ${PUST_UI.esc(p.designation||"")} • ${p.count} reviews</span></span>
      <span class="score">${p.count?p.overall.toFixed(1):"—"} <small>/ 5</small></span></a>`).join("");
  }
  document.getElementById("f").oninput=render;document.getElementById("dept").onchange=render;render();
})();
</script></body></html>
